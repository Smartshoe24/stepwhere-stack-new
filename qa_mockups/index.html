<!-- Night Trail stylesheet, copied from apps/admin/design/design-system.html -->
<style>
/* ==========================================================================
   Stepwhere Admin: "Night Trail" design system, v0.1 (dark theme)
   Every value in this file maps to a token below. Token names are
   theme-neutral in role so a light theme can be added later.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* Night: surfaces. One neutral hue, lightness steps only. */
  --night-inset:   #050507; /* inputs, wells: below canvas, reads as "type here" */
  --night-canvas:  #07070A; /* app background and sidebar */
  --night-raised:  #0E0E12; /* panels, table header, stat rows */
  --night-overlay: #15151A; /* menus, dialogs, popovers, toasts */
  --night-hover:   #1C1C22; /* highlighted item inside an overlay */

  /* Lines: low-opacity white so edges blend with any surface */
  --line-faint:  rgba(255, 255, 255, 0.06);
  --line:        rgba(255, 255, 255, 0.10);
  --line-strong: rgba(255, 255, 255, 0.16);

  /* Ink: four text levels */
  --ink:   #F4F4F6; /* primary */
  --ink-2: #A6A6AE; /* secondary */
  --ink-3: #80808A; /* tertiary, metadata: AA on every surface */
  --ink-4: #48484F; /* disabled only */

  /* Brand */
  --peach: #F5CF8D;
  --pink:  #FF66CB;
  --trail:   linear-gradient(90deg, var(--peach) 0%, var(--pink) 100%);
  --trail-v: linear-gradient(180deg, var(--peach) 0%, var(--pink) 100%);

  /* Peach speaks: anything with a word on it.
     Text-only actions use peach text; filled actions use a peach wash with white text. */
  --act-peach:      #F4C87D;                  /* the app's dark-theme accent (mobile navActive) */
  --act:            var(--act-peach);         /* links, sort arrow, filter values */
  --act-hover:      #F9DDA9;
  --act-fill:       rgba(244, 200, 125, 0.24); /* primary button: white text 11.9 : 1 */
  --act-fill-hover: rgba(244, 200, 125, 0.32);
  --act-fill-press: rgba(244, 200, 125, 0.18);
  --act-fill-line:  rgba(244, 200, 125, 0.46);
  --on-act-fill:    #FFFFFF;
  --on-peach:       #1B1307;                   /* only for the solid-peach experiment (12.4 : 1) */

  /* Pink switches: state with no words (checkbox, switch, radio, tab underline) */
  --toggle:       var(--pink);
  --toggle-wash:  rgba(255, 102, 203, 0.28);
  --on-toggle:    #14070F;                     /* check marks and knobs on pink */
  --on-trail:     #14070F;                     /* initials on the gradient avatar */

  /* Gradient hairlines. 0.5px on retina, 1px (one device pixel) elsewhere. */
  --hair: 1px;
  --edge: 1px;   /* active-nav and selected-row edge */

  /* Focus: the same weight as a control's own resting border (e.g. the
     destructive button's 1px edge), drawn in the trail, plus a soft halo. */
  --focus-hair:    var(--hair);
  --focus-opacity: 0.8;
  --focus-glow:
    0 0 14px -2px rgba(255, 102, 203, 0.24),
    0 0 6px -1px rgba(245, 207, 141, 0.20);

  /* Peach marks: where you are */
  --here:      var(--peach);
  --here-wash: rgba(245, 207, 141, 0.07);

  /* Status: same meanings as the mobile app */
  --ok:      #4ADE80; --ok-wash:      rgba(74, 222, 128, 0.12);
  --caution: #FF9F43; --caution-wash: rgba(255, 159, 67, 0.12);
  --breach:  #F87171; --breach-wash:  rgba(248, 113, 113, 0.12);
  --info:    #60A5FA; --info-wash:    rgba(96, 165, 250, 0.12);
  --unset:   #A78BFA; --unset-wash:   rgba(167, 139, 250, 0.12);

  /* Chart series, in order */
  --chart-1: var(--pink);
  --chart-2: var(--peach);
  --chart-3: var(--info);
  --chart-4: var(--ok);
  --chart-5: var(--unset);

  /* Type: 1.2 ratio from a 13px base */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-11: 11px;
  --t-12: 12px;
  --t-13: 13px;
  --t-14: 14px;
  --t-16: 16px;
  --t-19: 19px;
  --t-23: 23px;
  --t-28: 28px;

  /* Space: 4px base */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;

  /* Sizes: compact density */
  --h-control:    32px;
  --h-control-sm: 28px;
  --h-row:        36px;

  /* Radius: crisp */
  --r-xs:      4px;  /* checkbox, kbd, menu item */
  --r-control: 6px;  /* buttons, inputs, nav items */
  --r-card:    8px;  /* panels, tables, menus */
  --r-dialog:  12px; /* dialogs, screen frames */
  --r-pill:    999px;

  /* Depth: borders and surface steps. Shadow only on overlays. */
  --shadow-overlay: 0 0 0 1px var(--line), 0 16px 40px -12px rgba(0, 0, 0, 0.85), 0 4px 12px -4px rgba(0, 0, 0, 0.6);

  /* Motion */
  --ease-out:  cubic-bezier(0.23, 1, 0.32, 1);
  --ease-move: cubic-bezier(0.77, 0, 0.175, 1);
  --d-press:   120ms;
  --d-ui:      160ms;
  --d-overlay: 200ms;
}

@media (min-resolution: 2dppx) { :root { --hair: 0.5px; } }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--night-canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--t-13);
  line-height: 1.5;
}
h1, h2, h3, h4, h5, p, ol, ul, dl, dd, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
::selection { background: rgba(255, 102, 203, 0.32); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: var(--t-12); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Icons: 16px, 1.75 stroke, inherit color */
.i {
  width: 16px; height: 16px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}
.i-sm { width: 14px; height: 14px; }

/* ---------- Trail focus ----------
   A 1px peach→pink hairline drawn exactly on the element's edge (inheriting its
   radius, so corners always match) plus a faint halo. It replaces the element's
   own border while focused rather than stacking a second ring outside it. */
.fr { position: relative; outline: none; }
.fr:focus-visible,
.fr.is-focus,
.field:focus-within,
.field.is-focus {
  box-shadow: var(--focus-glow) !important;
}
.fr:focus-visible::after,
.fr.is-focus::after,
.field:focus-within::after,
.field.is-focus::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: var(--focus-hair);
  background: var(--trail);
  opacity: var(--focus-opacity);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
/* Checkbox: its ::after draws the "mixed" dash, so it uses a solid hairline. */
.check input:focus-visible + .box,
.box.is-focus {
  box-shadow: 0 0 0 var(--focus-hair) rgba(245, 207, 141, 0.8), var(--focus-glow) !important;
}
@media (forced-colors: active) {
  .fr:focus-visible, .field:focus-within, .check input:focus-visible + .box { outline: 2px solid CanvasText; outline-offset: 2px; }
}

/* ---------- Document chrome ---------- */
.doc-top {
  position: sticky; top: 0; z-index: 30;
  height: 56px;
  display: flex; align-items: center; gap: var(--s-4);
  padding: 0 var(--s-8);
  background: rgba(7, 7, 10, 0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-faint);
}
.doc-top .wm { height: 13px; width: auto; color: var(--ink); }
.doc-ver {
  font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3);
  height: 20px; display: inline-flex; align-items: center; padding: 0 6px;
  border: 1px solid var(--line); border-radius: var(--r-xs);
}
.doc-nav { display: flex; gap: 2px; margin-left: auto; }
.doc-nav a {
  text-decoration: none; color: var(--ink-3); font-size: var(--t-13); font-weight: 500;
  height: 30px; display: inline-flex; align-items: center; padding: 0 10px;
  border-radius: var(--r-control);
  transition: color var(--d-ui) var(--ease-out), background-color var(--d-ui) var(--ease-out);
}
.doc-nav a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.04); }

.doc { max-width: 1240px; margin: 0 auto; padding: 0 var(--s-8) 160px; }

.hero { padding: 88px 0 24px; }
.hero h1 {
  font-size: 56px; line-height: 1.02; font-weight: 600; letter-spacing: -0.035em;
  margin-top: var(--s-3);
}
.hero-lede { margin-top: var(--s-4); max-width: 60ch; font-size: var(--t-16); line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
.trail-rule { height: 1px; width: 120px; border-radius: 1px; background: var(--trail); margin: 36px 0 32px; }
.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-6); }
.principles li { font-size: var(--t-13); color: var(--ink-3); line-height: 1.55; text-wrap: pretty; }
.principles .no { display: block; font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-4); margin-bottom: var(--s-2); }
.principles b { display: block; color: var(--ink); font-weight: 600; font-size: var(--t-14); margin-bottom: 4px; }

.doc-section { padding-top: 96px; }
.sec-head { display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: var(--s-4); align-items: baseline; margin-bottom: var(--s-8); }
.sec-no { font-family: var(--font-mono); font-size: var(--t-12); color: var(--ink-4); }
.sec-title { font-size: var(--t-23); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.sec-lede { grid-column: 2; margin-top: 6px; max-width: 68ch; font-size: var(--t-14); color: var(--ink-2); text-wrap: pretty; }

.sub { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--s-3); row-gap: 2px; margin: 44px 0 var(--s-3); }
.sub:first-of-type { margin-top: 0; }
.sub h3 { font-size: var(--t-14); font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; }
.sub p { font-size: var(--t-13); color: var(--ink-3); }

.label {
  font-size: var(--t-11); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); line-height: 1.3;
}
.panel { background: var(--night-raised); border: 1px solid var(--line-faint); border-radius: var(--r-card); }
.specimen { padding: var(--s-6); }
.spec-grid { display: grid; gap: var(--s-3); }
.row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--s-2); }
.scroll-x { overflow-x: auto; }
.overlay-grid { grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: var(--s-6); }
.overlay-grid > * { min-width: 0; }
.scroll-x > .state-grid { min-width: 820px; }
.state-grid { display: grid; grid-template-columns: 120px repeat(6, minmax(0, 1fr)); align-items: center; gap: var(--s-4) var(--s-3); }
.state-grid .label { white-space: nowrap; }
.state-grid .col-h { font-size: var(--t-11); color: var(--ink-4); font-family: var(--font-mono); }
.note { font-size: var(--t-12); color: var(--ink-3); line-height: 1.5; text-wrap: pretty; }
.note code, .code { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-2); background: rgba(255, 255, 255, 0.05); padding: 1px 5px; border-radius: var(--r-xs); }

/* ---------- Brand specimens ---------- */
.brand-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s-3); }
.brand-stage {
  min-height: 220px; display: grid; place-items: center; position: relative; overflow: hidden;
  background: var(--night-canvas); border: 1px solid var(--line-faint); border-radius: var(--r-card);
}
.brand-stage .wm-lg { width: min(420px, 78%); height: auto; color: var(--ink); }
.brand-stage .em-lg { height: 96px; width: auto; }
.brand-cap { position: absolute; left: var(--s-4); bottom: var(--s-3); }
.trail-bar { height: 56px; border-radius: var(--r-card); background: var(--trail); }
.trail-meta { display: flex; justify-content: space-between; margin-top: var(--s-2); }
.usage { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.usage .panel { padding: var(--s-5); }
.usage h4 { font-size: var(--t-13); font-weight: 600; margin-bottom: var(--s-3); display: flex; align-items: center; gap: var(--s-2); }
.usage li { display: flex; gap: var(--s-2); font-size: var(--t-13); color: var(--ink-2); padding: 5px 0; border-top: 1px solid var(--line-faint); }
.usage li:first-child { border-top: 0; }
.usage li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: none; }
.usage .do li::before { background: var(--trail); }
.usage .dont li::before { background: var(--ink-4); }

/* ---------- Colour specimens ---------- */
.surface-stack { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s-2); }
.surface-chip { height: 132px; border-radius: var(--r-card); border: 1px solid var(--line); padding: var(--s-3); display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
.surface-chip b { font-size: var(--t-13); font-weight: 600; }
.surface-chip span { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); }
.nested { padding: var(--s-4); border-radius: var(--r-dialog); background: var(--night-canvas); border: 1px solid var(--line-faint); }
.nested > div { padding: var(--s-4); border-radius: var(--r-card); background: var(--night-raised); border: 1px solid var(--line-faint); }
.nested > div > div { padding: var(--s-4); border-radius: var(--r-control); background: var(--night-overlay); box-shadow: var(--shadow-overlay); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--s-2); }
.swatch { border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--line-faint); background: var(--night-raised); }
.swatch-fill { height: 64px; }
.swatch-meta { padding: 10px var(--s-3) var(--s-3); }
.swatch-meta b { display: block; font-size: var(--t-13); font-weight: 600; }
.swatch-meta span { display: block; font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); margin-top: 2px; }
.swatch-meta p { font-size: var(--t-12); color: var(--ink-3); margin-top: 6px; line-height: 1.45; }
.ink-rows { display: grid; gap: 1px; background: var(--line-faint); border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--line-faint); }
.ink-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 150px 110px; align-items: center; gap: var(--s-4); padding: var(--s-3) var(--s-4); background: var(--night-raised); }
.ink-row .sample { font-size: var(--t-14); }
.ratio { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); }
.ratio b { color: var(--ink-2); font-weight: 500; }
.grade { justify-self: start; font-family: var(--font-mono); font-size: var(--t-11); height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: var(--r-xs); border: 1px solid var(--line); color: var(--ink-2); }
.grade.aaa { color: var(--ok); border-color: rgba(74, 222, 128, 0.3); }
.grade.aa { color: var(--ink); }
.grade.dim { color: var(--ink-3); }
.role-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.role { padding: var(--s-5); }
.role h4 { display: flex; align-items: center; gap: var(--s-2); font-size: var(--t-14); font-weight: 600; margin-bottom: 4px; }
.role .dot { width: 10px; height: 10px; border-radius: 50%; }
.role > p { color: var(--ink-3); font-size: var(--t-13); margin-bottom: var(--s-4); }
.role-triple { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.experiment { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); }
.exp-opt { display: flex; flex-direction: column; gap: var(--s-3); }
.exp-stage { height: 112px; display: grid; place-items: center; border-radius: var(--r-control); background: var(--night-canvas); box-shadow: inset 0 0 0 1px var(--line-faint); }
.exp-opt figcaption { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.exp-opt figcaption b { font-size: var(--t-13); font-weight: 600; }
.exp-opt figcaption span:not(.pill) { font-size: var(--t-12); color: var(--ink-3); }
.exp-opt .pill { margin-top: 4px; }
.exp-switch { margin-top: var(--s-5); padding-top: var(--s-4); border-top: 1px solid var(--line-faint); }
.role-demo { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-4); background: var(--night-canvas); border: 1px solid var(--line-faint); border-radius: var(--r-control); }

/* ---------- Type specimens ---------- */
.type-rows { border-top: 1px solid var(--line-faint); }
.type-row { display: grid; grid-template-columns: 150px 170px minmax(0, 1fr); gap: var(--s-4); align-items: baseline; padding: var(--s-4) 0; border-bottom: 1px solid var(--line-faint); }
.type-row .spec { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); }
.type-row .use { font-size: var(--t-12); color: var(--ink-3); }
.type-row .sample { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); }
.tier-card { padding: var(--s-5); }
.tier-card .v { font-size: var(--t-14); font-weight: 600; color: var(--ink); }
.tier-card .l { font-size: var(--t-14); font-weight: 500; color: var(--ink-2); }
.tier-card .m { font-size: var(--t-14); font-weight: 400; color: var(--ink-3); }
.mono-samples { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-3); }
.mono-samples .panel { padding: var(--s-4); }
.mono-samples .mono { display: block; margin-top: 6px; color: var(--ink); font-size: var(--t-13); }

/* ---------- Space / radius / depth / motion ---------- */
.space-rows { display: grid; gap: 6px; }
.space-row { display: grid; grid-template-columns: 56px 60px minmax(0, 1fr); align-items: center; gap: var(--s-3); }
.space-row .bar { height: 12px; border-radius: 2px; background: rgba(255, 102, 203, 0.22); box-shadow: inset 0 0 0 1px rgba(255, 102, 203, 0.45); }
.space-row .mono { color: var(--ink-3); font-size: var(--t-11); }
.foundations { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.foundations > .panel { padding: var(--s-5); }
.foundations h4 { font-size: var(--t-13); font-weight: 600; margin-bottom: var(--s-4); }
.radius-row { display: flex; gap: var(--s-4); align-items: flex-end; }
.radius-row figure { display: flex; flex-direction: column; gap: var(--s-2); align-items: flex-start; }
.radius-row .box { width: 64px; height: 64px; border: 1px solid var(--line-strong); background: var(--night-overlay); }
.radius-row figcaption { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); }
.density-row { display: flex; gap: var(--s-5); flex-wrap: wrap; }
.density-row .mono { color: var(--ink-3); font-size: var(--t-11); }
.depth-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); }
.depth-demo { height: 96px; border-radius: var(--r-card); display: flex; align-items: flex-end; padding: var(--s-3); font-size: var(--t-12); color: var(--ink-3); }
.motion-list li { display: grid; grid-template-columns: 140px 72px minmax(0, 1fr); gap: var(--s-3); padding: 6px 0; border-top: 1px solid var(--line-faint); font-size: var(--t-13); color: var(--ink-2); }
.motion-list li:first-child { border-top: 0; }
.motion-list .mono { color: var(--ink-3); font-size: var(--t-11); }

/* ==========================================================================
   Components
   ========================================================================== */

/* ---------- Button ---------- */
.btn {
  --fr-r: var(--r-control);
  height: var(--h-control);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 12px;
  border: 0; border-radius: var(--r-control);
  font-size: var(--t-13); font-weight: 500; line-height: 1; white-space: nowrap;
  user-select: none;
  transition: background-color var(--d-ui) var(--ease-out), color var(--d-ui) var(--ease-out), box-shadow var(--d-ui) var(--ease-out), transform var(--d-press) var(--ease-out);
}
.btn .i { margin-left: -2px; }
.btn:active, .btn.is-active { transform: scale(0.97); }
.btn:disabled, .btn.is-disabled { cursor: not-allowed; transform: none; }
.btn-sm { height: var(--h-control-sm); padding: 0 10px; font-size: var(--t-12); }
.btn-icon { width: var(--h-control); padding: 0; }
.btn-icon .i { margin: 0; }
.btn-sm.btn-icon { width: var(--h-control-sm); }

/* Primary: peach wash, white text. Warm enough to lead, quiet enough for night. */
.btn-primary { background: var(--act-fill); color: var(--on-act-fill); font-weight: 600; box-shadow: inset 0 0 0 1px var(--act-fill-line); }
.btn-primary .i { color: var(--act-peach); }
.btn-primary:hover, .btn-primary.is-hover { background: var(--act-fill-hover); }
.btn-primary:active, .btn-primary.is-active { background: var(--act-fill-press); }
.btn-primary:disabled, .btn-primary.is-disabled { background: rgba(245, 207, 141, 0.05); color: var(--ink-4); box-shadow: inset 0 0 0 1px rgba(245, 207, 141, 0.10); }
.btn-primary:disabled .i { color: var(--ink-4); }

/* Experiment B: solid peach with dark ink. Toggle page-wide from the Button section. */
.btn-peach, [data-primary="solid"] .btn-primary { background: var(--peach); color: var(--on-peach); box-shadow: none; }
.btn-peach .i, [data-primary="solid"] .btn-primary .i { color: var(--on-peach); }
.btn-peach:hover, .btn-peach.is-hover, [data-primary="solid"] .btn-primary:hover, [data-primary="solid"] .btn-primary.is-hover { background: #F8DCA8; }
.btn-peach:active, .btn-peach.is-active, [data-primary="solid"] .btn-primary:active, [data-primary="solid"] .btn-primary.is-active { background: #E8BF78; }
[data-primary="solid"] .btn-primary:disabled { background: rgba(245, 207, 141, 0.18); color: rgba(27, 19, 7, 0.55); }
[data-primary="solid"] .btn-exp-a { background: var(--act-fill); color: var(--on-act-fill); box-shadow: inset 0 0 0 1px var(--act-fill-line); }
[data-primary="solid"] .btn-exp-a .i { color: var(--act-peach); }
/* Experiment C: solid peach with white. Fails contrast (1.5 : 1); shown for reference only. */
.btn-peach-white { background: var(--peach); color: #fff; box-shadow: none; font-weight: 600; }

.btn-secondary { background: var(--night-overlay); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn-secondary:hover, .btn-secondary.is-hover { background: var(--night-hover); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn-secondary:active, .btn-secondary.is-active { background: var(--night-raised); }
.btn-secondary:disabled, .btn-secondary.is-disabled { background: var(--night-raised); color: var(--ink-4); box-shadow: inset 0 0 0 1px var(--line-faint); }

.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover, .btn-ghost.is-hover { background: rgba(255, 255, 255, 0.05); color: var(--ink); }
.btn-ghost:active, .btn-ghost.is-active { background: rgba(255, 255, 255, 0.03); }
.btn-ghost:disabled, .btn-ghost.is-disabled { background: transparent; color: var(--ink-4); }

.btn-danger { background: var(--breach-wash); color: var(--breach); box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.28); }
.btn-danger:hover, .btn-danger.is-hover { background: rgba(248, 113, 113, 0.2); }
.btn-danger:active, .btn-danger.is-active { background: rgba(248, 113, 113, 0.14); }
.btn-danger:disabled, .btn-danger.is-disabled { background: transparent; color: rgba(248, 113, 113, 0.4); box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.12); }

.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin 700ms linear infinite; flex: none; opacity: 0.85;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Fields ---------- */
.field {
  --fr-r: var(--r-control);
  position: relative;
  height: var(--h-control);
  display: flex; align-items: center; gap: var(--s-2);
  padding: 0 10px;
  background: var(--night-inset);
  border-radius: var(--r-control);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink-3);
  transition: box-shadow var(--d-ui) var(--ease-out);
  min-width: 0;
}
.field:hover, .field.is-hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.field input {
  flex: 1; min-width: 0; height: 100%;
  border: 0; outline: 0; background: transparent;
  font-size: var(--t-13); color: var(--ink);
}
.field input::placeholder { color: var(--ink-3); }
.field.is-error { box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.55); }
.field.is-disabled { background: var(--night-raised); box-shadow: inset 0 0 0 1px var(--line-faint); color: var(--ink-4); }
.field.is-disabled input { color: var(--ink-4); cursor: not-allowed; }
.field.is-disabled input::placeholder { color: var(--ink-4); }
.field .suffix { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); }
.kbd {
  font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3);
  min-width: 20px; height: 20px; padding: 0 5px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-xs); box-shadow: inset 0 0 0 1px var(--line);
  background: var(--night-raised);
}
.field-label { display: block; font-size: var(--t-12); font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.field-help { font-size: var(--t-12); color: var(--ink-3); margin-top: 6px; }
.field-help.err { color: var(--breach); }

.select-trigger {
  --fr-r: var(--r-control);
  height: var(--h-control);
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: 0 8px 0 10px;
  background: var(--night-inset);
  border: 0; border-radius: var(--r-control);
  box-shadow: inset 0 0 0 1px var(--line);
  font-size: var(--t-13); color: var(--ink);
  transition: box-shadow var(--d-ui) var(--ease-out);
}
.select-trigger:hover, .select-trigger.is-hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.select-trigger .ph { color: var(--ink-3); }
.select-trigger .i { color: var(--ink-3); margin-left: auto; }

/* ---------- Checkbox / Switch / Radio ---------- */
.check { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--t-13); color: var(--ink-2); cursor: pointer; position: relative; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box {
  --fr-r: var(--r-xs);
  position: relative; flex: none;
  width: 16px; height: 16px; border-radius: var(--r-xs);
  background: var(--night-inset);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  display: grid; place-items: center;
  transition: background-color var(--d-ui) var(--ease-out), box-shadow var(--d-ui) var(--ease-out);
}
.box::before { content: ""; position: absolute; inset: -12px; } /* 40px hit area */
.box svg { width: 12px; height: 12px; stroke: var(--on-toggle); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(0.9); transition: opacity var(--d-press) var(--ease-out), transform var(--d-press) var(--ease-out); }
.check:hover .box, .box.is-hover { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); }
.check input:checked + .box, .box.is-on, .box.is-mixed { background: var(--toggle); box-shadow: none; }
.check input:checked + .box svg, .box.is-on svg { opacity: 1; transform: none; }
.box.is-mixed::after { content: ""; width: 8px; height: 2px; border-radius: 1px; background: var(--on-toggle); }
.box.is-disabled { background: var(--night-raised); box-shadow: inset 0 0 0 1px var(--line-faint); }
.box.is-disabled.is-on { background: var(--toggle-wash); }

.switch {
  --fr-r: var(--r-pill);
  position: relative; flex: none;
  width: 32px; height: 18px; border-radius: var(--r-pill); border: 0; padding: 0;
  background: var(--night-hover);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  transition: background-color var(--d-ui) var(--ease-out), box-shadow var(--d-ui) var(--ease-out);
}
.switch::before { content: ""; position: absolute; inset: -11px -6px; } /* 40px hit area */
.switch .knob {
  position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--ink-2);
  transition: transform var(--d-ui) var(--ease-out), background-color var(--d-ui) var(--ease-out);
}
.switch[aria-checked="true"] { background: var(--toggle); box-shadow: none; }
.switch[aria-checked="true"] .knob { transform: translateX(14px); background: var(--on-toggle); }
.switch:disabled { cursor: not-allowed; background: var(--night-raised); box-shadow: inset 0 0 0 1px var(--line-faint); }
.switch:disabled .knob { background: var(--ink-4); }
.switch[aria-checked="true"]:disabled { background: var(--toggle-wash); }
.switch[aria-checked="true"]:disabled .knob { background: rgba(20, 7, 15, 0.6); }

.radio { width: 16px; height: 16px; border-radius: 50%; background: var(--night-inset); box-shadow: inset 0 0 0 1px var(--line-strong); display: grid; place-items: center; flex: none; }
.radio.is-on { box-shadow: inset 0 0 0 1px var(--toggle); }
.radio.is-on::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--toggle); }

/* ---------- Tabs & segmented ---------- */
.tabs { display: flex; gap: var(--s-5); border-bottom: 1px solid var(--line-faint); }
.tab {
  --fr-r: var(--r-xs);
  position: relative;
  height: 36px; display: inline-flex; align-items: center; gap: 6px;
  padding: 0; border: 0; background: none;
  font-size: var(--t-13); font-weight: 500; color: var(--ink-3);
  transition: color var(--d-ui) var(--ease-out);
}
.tab { border-radius: var(--r-xs); }
.tab:focus-visible::after, .tab.is-focus::after { inset: 6px -6px; border-radius: var(--r-xs); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--toggle); }
.tab .count { font-size: var(--t-11); font-variant-numeric: tabular-nums; color: var(--ink-3); height: 18px; padding: 0 6px; display: inline-flex; align-items: center; border-radius: var(--r-pill); background: rgba(255, 255, 255, 0.06); }
.tab[aria-selected="true"] .count { color: var(--here); background: var(--here-wash); }

.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-control); background: var(--night-inset); box-shadow: inset 0 0 0 1px var(--line); }
.seg button {
  --fr-r: var(--r-xs);
  height: var(--h-control-sm); padding: 0 10px; border: 0; border-radius: var(--r-xs);
  background: transparent; color: var(--ink-3); font-size: var(--t-12); font-weight: 500;
  transition: background-color var(--d-ui) var(--ease-out), color var(--d-ui) var(--ease-out);
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--night-overlay); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- Status pill ---------- */
.pill {
  height: 20px; display: inline-flex; align-items: center; gap: 6px;
  padding: 0 8px 0 7px; border-radius: var(--r-pill);
  font-size: var(--t-12); font-weight: 500; line-height: 1; white-space: nowrap;
  background: rgba(255, 255, 255, 0.05); color: var(--ink-2);
  box-shadow: inset 0 0 0 1px var(--line-faint);
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill.no-dot::before { display: none; }
.pill.no-dot { padding: 0 8px; }
.pill-ok      { color: var(--ok);      background: var(--ok-wash);      box-shadow: none; }
.pill-caution { color: var(--caution); background: var(--caution-wash); box-shadow: none; }
.pill-breach  { color: var(--breach);  background: var(--breach-wash);  box-shadow: none; }
.pill-info    { color: var(--info);    background: var(--info-wash);    box-shadow: none; }
.pill-unset   { color: var(--unset);   background: var(--unset-wash);   box-shadow: none; }
.pill-muted   { color: var(--ink-3); }
.pill-muted::before { background: var(--ink-4); }
.tag { height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: var(--r-xs); font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- Live dot & freshness ---------- */
.live {
  position: relative; width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--trail);
}
.live::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 102, 203, 0.55) 0%, rgba(245, 207, 141, 0) 70%);
  animation: breathe 2.4s var(--ease-move) infinite;
}
@keyframes breathe { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.35); } }
.live-badge {
  height: 22px; display: inline-flex; align-items: center; gap: 7px; padding: 0 9px 0 8px;
  border-radius: var(--r-pill); font-size: var(--t-12); font-weight: 600; color: var(--ink);
  position: relative; background: var(--night-canvas);
}
.live-badge::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: var(--hair); background: var(--trail);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
}
.fresh { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-12); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fresh .ticks { display: inline-flex; gap: 2px; align-items: flex-end; }
.fresh .ticks i { width: 3px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); }
.fresh .ticks i:nth-child(1) { height: 5px; }
.fresh .ticks i:nth-child(2) { height: 8px; }
.fresh .ticks i:nth-child(3) { height: 11px; }
.fresh.f-live .ticks i { background: var(--trail-v); }
.fresh.f-live { color: var(--ink); }
.fresh.f-recent .ticks i:nth-child(-n+2) { background: var(--ok); }
.fresh.f-stale .ticks i:nth-child(1) { background: var(--caution); }
.fresh.f-stale { color: var(--caution); }
.fresh.f-off { color: var(--ink-3); }
.fresh-scale { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-2); }
.fresh-scale .panel { padding: var(--s-4); display: flex; flex-direction: column; gap: 10px; }
.fresh-scale .note { margin: 0; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: 232px; flex: none;
  display: flex; flex-direction: column; gap: var(--s-1);
  padding: var(--s-3) var(--s-2);
  background: var(--night-canvas);
  border-right: 1px solid var(--line-faint);
}
.sb-brand { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 10px; margin-bottom: var(--s-2); }
.sb-brand .wm { height: 12px; width: auto; color: var(--ink); }
.sb-brand .em { height: 22px; width: auto; display: none; }
.sb-group { padding: var(--s-3) 10px 6px; }
.nav-item {
  --fr-r: var(--r-control);
  position: relative;
  height: 32px; display: flex; align-items: center; gap: 10px;
  padding: 0 10px; border-radius: var(--r-control);
  color: var(--ink-2); font-size: var(--t-13); font-weight: 500; text-decoration: none;
  transition: background-color var(--d-ui) var(--ease-out), color var(--d-ui) var(--ease-out);
}
.nav-item .i { color: var(--ink-3); transition: color var(--d-ui) var(--ease-out); }
.nav-item:hover, .nav-item.is-hover { background: rgba(255, 255, 255, 0.04); color: var(--ink); }
.nav-item:hover .i, .nav-item.is-hover .i { color: var(--ink-2); }
.nav-item[aria-current="page"] { background: var(--here-wash); color: var(--here); }
.nav-item[aria-current="page"] .i { color: var(--here); }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -8px; top: 7px; bottom: 7px; width: var(--edge);
  border-radius: 0 1px 1px 0; background: var(--trail-v);
}
.nav-item .nav-count { margin-left: auto; font-size: var(--t-11); font-variant-numeric: tabular-nums; color: var(--ink-3); }
.nav-item[aria-current="page"] .nav-count { color: var(--here); opacity: 0.8; }
.nav-item .nav-alert { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; font-size: var(--t-11); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--breach); background: var(--breach-wash); }
.sb-foot { display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid var(--line-faint); }
.avatar { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: var(--t-11); font-weight: 600; color: var(--on-trail); background: var(--trail); }
.avatar.plain { background: var(--night-hover); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.sb-foot .who { min-width: 0; line-height: 1.3; }
.sb-foot .who b { display: block; font-size: var(--t-13); font-weight: 500; }
.sb-foot .who span { display: block; font-size: var(--t-11); color: var(--ink-3); }

.sidebar.is-collapsed { width: 56px; align-items: center; }
.sidebar.is-collapsed .sb-brand { padding: 0; justify-content: center; }
.sidebar.is-collapsed .sb-brand .wm, .sidebar.is-collapsed .sb-brand .btn { display: none; }
.sidebar.is-collapsed .sb-brand .em { display: block; }
.sidebar.is-collapsed .sb-group { height: 1px; padding: 0; width: 20px; background: var(--line-faint); margin: 10px 0; }
.sidebar.is-collapsed .sb-group span { display: none; }
.sidebar.is-collapsed .nav-item { width: 36px; padding: 0; justify-content: center; }
.sidebar.is-collapsed .nav-item .t, .sidebar.is-collapsed .nav-item .nav-count { display: none; }
.sidebar.is-collapsed .nav-item .nav-alert { position: absolute; top: 3px; right: 2px; min-width: 7px; width: 7px; height: 7px; padding: 0; font-size: 0; background: var(--breach); }
.sidebar.is-collapsed .nav-item[aria-current="page"]::before { left: -10px; }
.sidebar.is-collapsed .sb-foot { padding: 10px 0 0; justify-content: center; }
.sidebar.is-collapsed .sb-foot .who { display: none; }

/* ---------- Table ---------- */
.tbl-wrap { border-radius: var(--r-card); box-shadow: inset 0 0 0 1px var(--line-faint); overflow: hidden; background: var(--night-canvas); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--t-13); }
.tbl th {
  height: 32px; padding: 0 var(--s-3); text-align: left; white-space: nowrap;
  font-size: var(--t-11); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3);
  background: var(--night-raised); border-bottom: 1px solid var(--line-faint);
  position: sticky; top: 0; z-index: 1;
}
.tbl th.sorted { color: var(--ink); }
.tbl th .th-in { display: inline-flex; align-items: center; gap: 4px; }
.tbl th .i-sm { color: var(--ink-3); }
.tbl th.sorted .i-sm { color: var(--act); }
.tbl td { height: var(--h-row); padding: 0 var(--s-3); border-bottom: 1px solid var(--line-faint); white-space: nowrap; color: var(--ink-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .c-check { width: 40px; padding-right: 0; }
.tbl .c-num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .c-act { width: 44px; text-align: right; padding-right: 6px; }
.tbl .primary-cell { color: var(--ink); font-weight: 500; }
.tbl .sub-cell { color: var(--ink-3); font-size: var(--t-12); margin-left: 6px; }
.tbl tbody tr { transition: background-color var(--d-ui) var(--ease-out); }
.tbl tbody tr:hover, .tbl tbody tr.is-hover { background: rgba(255, 255, 255, 0.025); }
.tbl tbody tr.is-selected { background: var(--here-wash); }
.tbl tbody tr.is-selected td:first-child { box-shadow: inset 2px 0 0 0 transparent; background-image: var(--trail-v); background-size: var(--edge) 100%; background-repeat: no-repeat; }
.tbl tbody tr.is-selected .primary-cell { color: var(--here); }
.row-act { opacity: 0; transition: opacity var(--d-ui) var(--ease-out); }
.tbl tbody tr:hover .row-act, .tbl tbody tr.is-hover .row-act, .tbl tbody tr.is-selected .row-act { opacity: 1; }
.cell-with-av { display: inline-flex; align-items: center; gap: 8px; }
.cell-with-av .avatar { width: 20px; height: 20px; font-size: 9px; }

.tbl-foot { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s-3); border-top: 1px solid var(--line-faint); background: var(--night-canvas); font-size: var(--t-12); color: var(--ink-3); }
.pager { display: flex; align-items: center; gap: 2px; }
.pager .pg {
  --fr-r: var(--r-control);
  min-width: 28px; height: 28px; padding: 0 6px; border: 0; border-radius: var(--r-control);
  background: transparent; color: var(--ink-3); font-size: var(--t-12); font-variant-numeric: tabular-nums;
  transition: background-color var(--d-ui) var(--ease-out), color var(--d-ui) var(--ease-out);
}
.pager .pg:hover { background: rgba(255, 255, 255, 0.05); color: var(--ink); }
.pager .pg[aria-current="page"] { background: var(--night-overlay); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.pager .pg:disabled { color: var(--ink-4); background: none; cursor: not-allowed; }

.bulk {

/* ---------------- render ---------------- */
const V = { flow: vFlow, overview: vOverview, units: vUnits, unit: vUnit, bench: vBench, runs: vRuns, suites: vSuites, firmware: vFirmware, stations: vStations, shipping: vShipping };
const root = document.getElementById('root');
function render(keep) {
  const old = root.querySelector('.page');
  const top = keep && old ? old.scrollTop : 0;
  const nav = ['flow', 'overview', 'units', 'unit', 'bench', 'runs', 'suites', 'firmware', 'stations', 'shipping'];
  root.innerHTML = `<div class="mock-nav"><svg class="wm" viewBox="0 0 670.24 84"><use href="#wordmark"/></svg><span class="t">QA mockup · screens</span>${nav.map((k) => `<button type="button" aria-pressed="${S.screen === k}" data-go="${k}">${k === 'unit' ? 'Unit detail' : TITLES[k]}</button>`).join('')}</div>
  <div class="screen app">${sidebar()}<div class="screen-main">${topbar()}<div class="page">${V[S.screen]()}</div>${S.sheet ? sheetRun() : ''}${S.modal ? modal() : ''}</div></div>`;
  const p = root.querySelector('.page');
  if (p) p.scrollTop = top;
  const c = root.querySelector('.console');
  if (c) c.scrollTop = c.scrollHeight;
  startSim();
}
function go(k, arg) {
  stopSim(); S.screen = k; S.modal = S.sheet = null;
  if (k === 'bench') { S.layout = 'single'; setBench(arg || 'idle'); }
  if (k === 'unit' && arg) { S.unit = arg; S.unitTab = 'timeline'; }
  if (k === 'units' && arg) S.unitsTab = arg;
  if (k === 'shipping' && arg) S.shipTab = arg;
  render();
}
function handle(t, e) {
  const { go: g, act, arg } = t.dataset;
  if (g) return go(g, arg);
  const r = () => render(true);
  switch (act) {
    case 'bench': setBench(arg); r(); break;
    case 'layout': stopSim(); S.layout = arg; r(); break;
    case 'tab-unit': S.unitTab = arg; r(); break;
    case 'tab-units': S.unitsTab = arg; r(); break;
    case 'tab-ship': S.shipTab = arg; r(); break;
    case 'tab-runs': S.runsTab = arg; r(); break;
    case 'suite': S.suite = arg; r(); break;
    case 'fw': S.fw = arg; r(); break;
    case 'modal': S.modal = arg; S.sheet = null; r(); break;
    case 'sheet': S.sheet = arg; r(); break;
    case 'close': S.modal = S.sheet = null; r(); break;
    case 'usel': S.usel.has(arg) ? S.usel.delete(arg) : S.usel.add(arg); r(); break;
    case 'ssel': S.ssel.has(arg) ? S.ssel.delete(arg) : S.ssel.add(arg); r(); break;
    case 'uclear': S.usel.clear(); r(); break;
    case 'sclear': S.ssel.clear(); r(); break;
  }
}
root.addEventListener('click', (e) => {
  if (e.target.matches('[data-close]')) { S.modal = S.sheet = null; return render(true); }
  if (e.target.closest('.switch')) { const sw = e.target.closest('.switch'); sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')); return; }
  if (e.target.closest('.seg button:not([data-act])')) { const b = e.target.closest('button'); b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); return; }
  const t = e.target.closest('[data-go],[data-act]');
  if (t) handle(t, e);
});
new ResizeObserver(() => {
  const app = root.querySelector('.app');
  if (!app) return;
  const want = app.clientWidth < 1000;
  if (want !== !!S.collapsed) { S.collapsed = want; render(true); }
}).observe(root);
(function initFromUrl() {
  const p = new URLSearchParams(location.search);
  const s = p.get('s');
  if (!s) return;
  S.screen = s;
  if (p.get('u')) S.unit = p.get('u');
  if (p.get('t')) S.unitTab = p.get('t');
  if (p.get('ship')) S.shipTab = p.get('ship');
  if (p.get('fw')) S.fw = p.get('fw');
  if (p.get('suite')) S.suite = p.get('suite');
  if (p.get('m')) S.modal = p.get('m');
  if (p.get('sheet')) S.sheet = p.get('sheet');
  if (p.get('lay')) S.layout = p.get('lay');
  if (p.get('sel')) S.usel.add(p.get('sel'));
  if (s === 'bench') setBench(p.get('b') || 'idle');
})();
render();
(function freezeForScreenshots() {
  const p = new URLSearchParams(location.search);
  if (!p.get('freeze')) return;
  stopSim();
  if (S.bench === 'testing') Object.assign(S.sim, { t: 9.4, gps: 151, steps: 14, pk: 18, wifi: 4, log: ['<span class="ag">[server]</span> watching IMEI 867946053102187 · suite Functional v4', '<span class="ok">[server] first packet accepted · 201 · uptimeMs 9412 · firmwareVersion 1.2</span>', '[TEL] seq=17 http=201 result=accepted sats=4 steps=12', '[TEL] seq=18 http=201 result=accepted sats=4 steps=14'] });
  if (S.bench === 'flashing') { S.sim.p = 64; S.sim.log = FL.filter((x) => x[0] <= 64).map((x) => x[1]); }
  upd();
})();

</script>
