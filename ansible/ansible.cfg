[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
remote_user = ubuntu
result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False
# SSM sessions take a few seconds to open.
timeout = 60
# Vault password: export ANSIBLE_VAULT_PASSWORD_FILE or pass --ask-vault-pass.
# SSH key: export ANSIBLE_PRIVATE_KEY_FILE or load it in ssh-agent.

[ssh_connection]
pipelining = True
# Port 22 is never open. SSH runs inside an SSM Session Manager session; hosts
# are instance IDs. Needs the Session Manager plugin and AWS_PROFILE=stepwhere-prod.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o "ProxyCommand=sh -c \"aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ap-south-1\""
