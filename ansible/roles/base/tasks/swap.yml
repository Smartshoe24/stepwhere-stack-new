---
- name: Check for the swap file
  ansible.builtin.stat:
    path: "{{ base_swap_file }}"
  register: base_swap_stat

- name: Allocate the swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ base_swap_size }} {{ base_swap_file }}"
  when: not base_swap_stat.stat.exists
  changed_when: true

- name: Restrict the swap file permissions
  ansible.builtin.file:
    path: "{{ base_swap_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or base_swap_stat.stat.exists

- name: Look for an existing swap signature
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ base_swap_file }}"
  register: base_swap_blkid
  changed_when: false
  failed_when: base_swap_blkid.rc not in [0, 2]
  check_mode: false
  when: not ansible_check_mode or base_swap_stat.stat.exists

- name: Format the swap file
  ansible.builtin.command:
    cmd: "mkswap {{ base_swap_file }}"
  when:
    - not ansible_check_mode
    - base_swap_blkid.stdout != 'swap'
  changed_when: true

- name: Add the swap file to fstab
  ansible.posix.mount:
    src: "{{ base_swap_file }}"
    path: none
    fstype: swap
    opts: sw
    state: present

- name: List active swap
  ansible.builtin.command:
    cmd: swapon --noheadings --show=NAME
  register: base_swapon
  changed_when: false
  check_mode: false

- name: Enable the swap file
  ansible.builtin.command:
    cmd: "swapon {{ base_swap_file }}"
  when:
    - not ansible_check_mode
    - base_swap_file not in base_swapon.stdout_lines
  changed_when: true

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ base_swappiness }}"
    sysctl_file: /etc/sysctl.d/90-stepwhere.conf
    state: present
    reload: true
