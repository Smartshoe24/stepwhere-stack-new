---
stack_dir: /srv/stepwhere
stack_pangolin_dir: /srv/pangolin
stack_beszel_dir: /srv/beszel
stack_redis_dir: /srv/redis
stack_infisical_env_file: /etc/stepwhere/infisical.env

# Bring the Compose project up at the end of site.yml. Set false before the ECR images exist.
stack_start: true
# Limit `up` to these services (empty = all).
stack_services: []

stack_redis_password: "{{ vault_redis_password }}"
# Empty until the Beszel hub has generated its key; the agent is not started while it is empty.
stack_beszel_agent_key: "{{ vault_beszel_agent_key | default('') }}"

stack_registry: "{{ ecr_registry }}"
